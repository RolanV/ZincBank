name: Playwright Tests

# SUPERSEDED by ci.yml.
#
# This repository was restructured to a Cucumber-only BDD layout, which removed
# playwright.config.ts and every *.spec.ts file. `npx playwright test` therefore
# exits 1 with "Error: No tests found".
#
# The file is retained pending a separate decision on removal. Its automatic
# triggers are disabled so it cannot report a failure for a Playwright-runner
# layer this repository no longer contains. Manual dispatch only.
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
