name: Framework Checks

# Framework-level validation that does NOT depend on the external CYDEO demo
# application. These checks stay meaningful (and should stay green) even if the
# third-party demo server changes or is shut down, because they validate this
# repository's own code: lint rules, and whether every Gherkin step in every
# feature file resolves to exactly one step definition.
#
# Live end-to-end execution against the demo app lives in e2e.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint & scenario integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # @cucumber/cucumber@13.2.1 declares engines.node "22 || 24 || >=26",
          # so Node 20 is not supported by the test runner.
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Lint
        run: npm run lint

      # --dry-run resolves every step against the step definitions without
      # executing steps or hooks: no browser is launched and no request is made
      # to the demo application. Scope: it validates Gherkin-to-step-definition
      # matching, and that the step/hook modules load under ts-node. It does
      # NOT exercise page objects, locators or browser behaviour -- only the
      # live E2E run does that.
      - name: Resolve all Gherkin steps (dry run, no browser, no network)
        run: |
          set -o pipefail
          npm run test:dry 2>&1 | tee "$RUNNER_TEMP/cucumber.log"

      # cucumber-js exits 0 even when it reports undefined or ambiguous steps,
      # and also when a tag expression matches nothing. Verified locally:
      # a dry run with 1 undefined step exits 0, with or without --strict.
      # The exit code therefore cannot be trusted; parse the summary instead.
      - name: Verify scenario integrity
        run: |
          summary=$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/cucumber.log" \
            | grep -oE '^[0-9]+ scenarios?.*' | tail -1)
          if [ -z "$summary" ]; then
            echo "::error::No Cucumber summary line found; cannot confirm what ran."
            exit 1
          fi
          if [ "${summary%% *}" -eq 0 ]; then
            echo "::error::Cucumber discovered 0 scenarios."
            exit 1
          fi
          case "$summary" in
            *undefined*|*ambiguous*|*pending*)
              echo "::error::Unresolved steps detected: $summary"
              exit 1
              ;;
          esac
          echo "Cucumber summary: $summary"
